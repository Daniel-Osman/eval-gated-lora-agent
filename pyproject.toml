[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-gated-lora-agent"
version = "0.1.0"
description = "A store support agent whose replies are gated on database state, not its own log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.scripts]
shopagent = "shopagent.cli:main"

[tool.setuptools.packages.find]
include = ["shopagent*"]
